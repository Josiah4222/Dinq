# Dinq — nginx site configuration
#
# Serves the built Angular app and the Django API from one origin, and
# terminates TLS.
#
# One origin is not a preference, it is a requirement. The Angular app calls the
# API with root-relative paths (`/api/...`) and has no configurable API base URL,
# so the browser resolves them against whichever host served the page. Staff
# sign-in is a session cookie with SameSite=Lax, so if the app and the API were
# on different hosts the browser would refuse to send the cookie and login would
# fail in a way that looks like wrong credentials.
#
# Paths, adjusted per host:
#   /srv/dinq/frontend/dist/dinq/browser  the Angular build (note the /browser
#                                         nesting — the modern Angular builder
#                                         puts it one level down)
#   /srv/dinq/backend/staticfiles         collected Django static
#   /srv/dinq/backend/media               uploaded images
#   127.0.0.1:8000                        gunicorn

upstream dinq_app {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Plain HTTP exists only to redirect. If a visitor types the address or follows
# an http:// link, they end up on https without a page in between.
server {
    listen 80;
    listen [::]:80;
    server_name dinqadvisory.com www.dinqadvisory.com 2.25.106.23;

    # Lets Encrypt renew over HTTP. certbot's webroot challenge writes here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.dinqadvisory.com$request_uri;
    }
}

server {
    # The `http2` listen parameter, not the `http2 on;` directive: the server
    # runs nginx 1.24, which predates the directive and rejects it outright. The
    # parameter is deprecated but still honoured on newer nginx, so this works
    # on both.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dinqadvisory.com www.dinqadvisory.com 2.25.106.23;

    # certbot writes these. Both names are on the certificate: www is a CNAME to
    # the apex, so a single-name certificate on www would not cover
    # dinqadvisory.com and the browser would warn on the apex.
    ssl_certificate     /etc/letsencrypt/live/dinqadvisory.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dinqadvisory.com/privkey.pem;

    # Lets Encrypt renew over HTTP. The redirect above is the default and it
    # would redirect the challenge away, so the ACME location from the http
    # server is repeated here.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Both names redirect to one canonical host, so a shared link always lands
    # in the same place and the browser only holds one cookie.
    if ($host = "dinqadvisory.com") {
        return 301 https://www.dinqadvisory.com$request_uri;
    }
    if ($host = "2.25.106.23") {
        return 301 https://www.dinqadvisory.com$request_uri;
    }

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Media can be large — an uploaded site photograph, not a thumbnail. The
    # default 1m would fail the upload with a 413.
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # ---- The built Angular app -------------------------------------------
    root /srv/dinq/frontend/dist/dinq/browser;
    index index.html;

    # Hashed filenames, so they can be cached indefinitely. A rebuild produces
    # new names, which is what makes this safe.
    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `^~` matters here, it is not decoration. Without it the hashed-asset regex
    # above wins for any /static/.../*.css or /media/.../*.jpg, and its
    # try_files runs against the Angular build root — which would 404 every
    # Django admin stylesheet and every uploaded image.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Django's collected static, including the css/auth.css that the Django
    # admin login page loads. Not immutable, because the name is not hashed.
    location ^~ /static/ {
        alias /srv/dinq/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Uploaded images. The app is explicitly built to have the web server own
    # this directory: Django only serves media when DEBUG is on, and DEBUG is
    # off in production, so nothing is reachable unless it is aliased here.
    location ^~ /media/ {
        alias /srv/dinq/backend/media/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ---- Django ------------------------------------------------------------
    # The JSON API and the stock Django admin. Everything else on a page is the
    # Angular app, including the staff panel: /admin/... deliberately falls
    # through to the SPA fallback below.
    location /api/ {
        proxy_pass http://dinq_app;
        proxy_set_header Host              $host;
        # Django builds absolute URLs for redirects and CSRF; without the real
        # scheme it would generate http:// links on an https page.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 60s;
    }

    # The built-in admin lives at /django-admin/ so the custom staff panel keeps
    # the /admin/... address it was built on. The slashless form is redirected
    # first: a prefix match on /django-admin/ would miss it, and the SPA would
    # answer with its own 404 page instead.
    location = /django-admin {
        return 301 /django-admin/;
    }

    location /django-admin/ {
        proxy_pass http://dinq_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
    }

    # Staff sign-in used to be a server-rendered Django page at /login/; it is
    # the Angular login now. The router registered the route without a trailing
    # slash, and Angular parses the empty trailing segment as a real segment, so
    # /login/ would miss the route and fall through to the SPA's 404. Redirect
    # instead, keeping the query string (?next=... survives).
    location = /login/ {
        return 301 /login$is_args$args;
    }

    # Same reason: 'admin' is a redirect route to /admin/contact, and a trailing
    # slash would make it two segments, which matches nothing.
    location = /admin/ {
        return 301 /admin$is_args$args;
    }

    # ---- The single-page app fallback -------------------------------------
    # The client-side router owns every other path — the staff panel at
    # /admin/... and the sign-in page at /login included, which is what makes a
    # hard refresh of /admin/contact come back as the app rather than a 404. The
    # try_files chain checks the real file first so static assets still 404
    # honestly instead of silently returning HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
