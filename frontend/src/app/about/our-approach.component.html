<main id="main" class="sp">

  <!-- ================================ Hero ================================ -->
  <section class="sp-hero">
    <div class="sp-hero__media" role="presentation">
      <img
        [src]="heroImage() | imageSrc"
        alt=""
        fetchpriority="high"
        decoding="async"
        class="sp-hero__img"
      />
      <div class="sp-hero__overlay" aria-hidden="true"></div>
    </div>
    <svg class="sp-hero__routes" viewBox="0 0 1200 500" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path d="M -50 420 Q 300 200 620 300 T 1250 140" fill="none" stroke="rgba(200,155,60,0.22)" stroke-width="1.1" stroke-dasharray="2 8" stroke-linecap="round"/>
      <circle cx="620" cy="300" r="4" fill="#C89B3C"/>
    </svg>
    <span class="sp-hero__orb" aria-hidden="true"></span>
    <span class="grain" aria-hidden="true"></span>
    <div class="container sp-hero__inner">
      <p class="eyebrow">{{ heroEyebrow() }}</p>
      <h1 class="sp-hero__title">{{ heroTitle() }}</h1>
    </div>
  </section>

  <!-- ========================== Approach body ============================= -->
  <section id="approach" class="sp-section sp-section--tint" appReveal>
    <div class="container">
      <header class="sp-head">
        <p class="eyebrow">{{ approachEyebrow() }}</p>
        <h2 class="sp-title">{{ approachHeading() }}</h2>
      </header>

      @for (p of approachIntro(); track p) {
        <p class="approach__intro">{{ p }}</p>
      }

      <ul class="approach__pillars" aria-label="Our approach pillars">
        @for (pillar of approachPillars(); track pillar.title) {
          <li class="approach__pillar">
            <h3 class="approach__pillar-title">{{ pillar.title }}</h3>
            <p class="approach__pillar-text">{{ pillar.text }}</p>
          </li>
        }
      </ul>

      <div class="approach__cta">
        <a routerLink="/contact" class="btn btn--gold">{{ approachCta() }}</a>
      </div>
    </div>
  </section>

</main>
