<ol
  class="hww-timeline"
  [class.hww-timeline--full]="mode() === 'full'"
  aria-label="Our four-step process"
>
  @for (step of steps; track step.title; let i = $index; let last = $last) {
    <li class="hww-timeline__step" [style.--step-i]="i">
      <div class="hww-timeline__rail" aria-hidden="true">
        <span class="hww-timeline__node"></span>
        @if (!last) {
          <span class="hww-timeline__connector"></span>
        }
      </div>
      <div class="hww-timeline__body">
        <p class="hww-timeline__label" aria-hidden="true">0{{ i + 1 }}</p>
        <h3 class="hww-timeline__title">{{ step.title }}</h3>
        <p class="hww-timeline__text">{{ step.text }}</p>
      </div>
    </li>
  }
</ol>
