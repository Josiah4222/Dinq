<main class="staff">
  <!-- Full-height navigation rail -->
  <aside class="rail">
    <div class="rail__brand">
      <span class="rail__mark">Dinq</span>
      <span class="rail__sub">Staff</span>
    </div>

    <nav class="rail__nav" aria-label="Staff sections">
      <p class="rail__label">Submissions</p>

      @for (item of submissionItems(); track item.id) {
        <a [routerLink]="item.route" routerLinkActive="is-active" class="rail__link">
          <span class="rail__icon" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              @switch (item.icon) {
                @case ('envelope') {
                  <path
                    d="M3.5 6.5h17v11h-17z"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                  <path
                    d="m3.5 7 8.5 6 8.5-6"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                }
                @case ('building') {
                  <path
                    d="M5 20.5V5.5l7-2.5v17.5"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                  <path
                    d="M12 20.5h7v-9h-7z"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                  <path
                    d="M8 8.5v.01M8 12v.01M8 15.5v.01M15.5 15v.01"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round" />
                }
                <!-- The short-form queue: a message that arrives all at once. -->
                @case ('bolt') {
                  <path
                    d="M13.5 3 6 13.5h5l-1 7.5 7.5-10.5h-5l1-7.5Z"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                }
                @default {
                  <path
                    d="M5 6h14v12H5z"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                  <path
                    d="M5 7.5 12 13l7-5.5"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linejoin="round" />
                }
              }
            </svg>
          </span>
          <span class="rail__text">{{ item.label }}</span>
          @if (countFor(item.countKey); as count) {
            <span class="rail__count">{{ count }}</span>
          }
        </a>
      }

      <p class="rail__label rail__label--spaced">Content</p>

      <a routerLink="/admin/pages" routerLinkActive="is-active" class="rail__link">
        <span class="rail__icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M5 4.5h9.5L19 9v10.5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1Z"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            <path
              d="M14 4.5V9h5"
              stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
            <path
              d="M8 13h8M8 16.5h5.5"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
          </svg>
        </span>
        <span class="rail__text">Page content</span>
      </a>
    </nav>

    <div class="rail__foot">
      <div class="rail__user">
        <span class="rail__avatar" aria-hidden="true">{{ initials() }}</span>
        <span class="rail__identity">
          <span class="rail__name">{{ displayName() }}</span>
          <span class="rail__role">{{ user()?.isSuperuser ? 'Superuser' : 'Staff' }}</span>
        </span>
      </div>
      <button type="button" class="rail__signout" (click)="signOut()" [disabled]="signingOut()">
        {{ signingOut() ? 'Signing out…' : 'Sign out' }}
      </button>
    </div>
  </aside>

  <!-- Content -->
  <div class="staff__main">
    <ng-content />
  </div>
</main>
