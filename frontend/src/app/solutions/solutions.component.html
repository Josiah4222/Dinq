<section class="solutions section" appReveal aria-labelledby="solutions-title">
  <div class="container">

    <header class="section-head">
      <p class="eyebrow">Our Solutions</p>
      <h2 id="solutions-title" class="section-title">How we serve our clients</h2>
    </header>

    <ol class="solutions__list">
      @for (solution of solutions; track solution.title; let i = $index) {
        <li class="solutions__item" [style.--item-i]="i">
          <span class="solutions__num" aria-hidden="true">0{{ i + 1 }}</span>
          <div class="solutions__body">
            <h3 class="solutions__title">{{ solution.title }}</h3>
            <p class="solutions__text">{{ solution.text }}</p>
          </div>
          <span class="solutions__arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8h10M9 4l4 4-4 4"/>
            </svg>
          </span>
        </li>
      }
    </ol>

  </div>
</section>
